name: Release OSS (APK)

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - v*

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust/.cargo/config.toml') }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0

      - name: Create Secrets file
        env:
          SECRETS_CONTENT: ${{ secrets.SECRETS }}
          GH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GH_APP_CLIENT_ID: ${{ secrets.GH_APP_CLIENT_ID }}
          GH_APP_CLIENT_SECRET: ${{ secrets.GH_APP_CLIENT_SECRET }}
        run: |
          if [ -n "$SECRETS_CONTENT" ]; then
            echo "Creating file with full SECRETS secret"
            printf '%s\n' "$SECRETS_CONTENT" > ./lib/constant/secrets.dart
          else
            echo "Generating secrets.dart from individual secrets / template fallback"
            cat <<EOF > ./lib/constant/secrets.dart
          const oauthRedirectUrl = "gitsynckaell://auth";
          const gitHubClientId = "$GH_CLIENT_ID";
          const gitHubClientSecret = "$GH_CLIENT_SECRET";
          const gitHubAppClientId = "${GH_APP_CLIENT_ID:-$GH_CLIENT_ID}";
          const gitHubAppClientSecret = "${GH_APP_CLIENT_SECRET:-$GH_CLIENT_SECRET}";
          const giteaClientId = "";
          const gitlabClientId = "";
          const codebergClientId = "";
          EOF
          fi

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: 3.35.2

      - name: Set Up JDK
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

      - name: Install cargo-expand
        run: cargo install cargo-expand --version 1.0.121 --locked

      - name: Get Packages
        run: flutter pub get

      - name: Generate Rust
        run: |
          flutter_rust_bridge_codegen generate
          git checkout HEAD -- rust/src/frb_generated.rs

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29-beta4

      - uses: SimonMarquis/android-accept-licenses@v1

      - name: Build Release APK (arm64-v8a)
        run: |
          export CARGO_ENCODED_RUSTFLAGS=$(printf '%s\x1f%s\x1f%s' "--remap-path-prefix=$HOME/.cargo/registry/src=/cargo/registry/src" "--remap-path-prefix=$GITHUB_WORKSPACE=." "-Ccodegen-units=1")
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          flutter build apk --release --split-per-abi --target-platform="android-arm64"

      - name: Cache Fallback Keystore
        uses: actions/cache@v6
        with:
          path: ~/.android-signing
          key: gitsync-fallback-keystore-v1

      - name: Prepare Signing Credentials
        id: signing_creds
        env:
          SECRET_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          SECRET_ALIAS: ${{ secrets.RELEASE_SIGNING_ALIAS }}
          SECRET_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE" ] && [ -n "$SECRET_ALIAS" ] && [ -n "$SECRET_PASSWORD" ]; then
            echo "Using repository signing secrets"
            echo "keystore_b64=$SECRET_KEYSTORE" >> "$GITHUB_OUTPUT"
            echo "alias=$SECRET_ALIAS" >> "$GITHUB_OUTPUT"
            echo "password=$SECRET_PASSWORD" >> "$GITHUB_OUTPUT"
          else
            echo "Generating or reusing cached fallback keystore"
            mkdir -p ~/.android-signing
            if [ ! -f ~/.android-signing/release.keystore ]; then
              keytool -genkeypair -v \
                -keystore ~/.android-signing/release.keystore \
                -alias gitsync_kaell \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass gitsync_kaell_pass \
                -keypass gitsync_kaell_pass \
                -dname "CN=Kaell, OU=GitSync, O=Kaell, L=BR, S=BR, C=BR"
            fi
            KEYSTORE_B64=$(base64 -w 0 ~/.android-signing/release.keystore)
            echo "::add-mask::$KEYSTORE_B64"
            echo "keystore_b64=$KEYSTORE_B64" >> "$GITHUB_OUTPUT"
            echo "alias=gitsync_kaell" >> "$GITHUB_OUTPUT"
            echo "password=gitsync_kaell_pass" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign App
        id: sign_app
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: build/app/outputs/flutter-apk/
          signingKey: ${{ steps.signing_creds.outputs.keystore_b64 }}
          keyAlias: ${{ steps.signing_creds.outputs.alias }}
          keyStorePassword: ${{ steps.signing_creds.outputs.password }}
          keyPassword: ${{ steps.signing_creds.outputs.password }}
          buildToolsVersion: 34.0.0

      - name: Format App List
        id: signed_file_artifacts
        run: |
          {
            echo "signedFiles<<SIGNED_FILES_EOF_DELIMETER"
            echo "${{ steps.sign_app.outputs.signedFiles }}" | sed 's/:/\n/g'
            echo "SIGNED_FILES_EOF_DELIMETER"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Release Build to Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            ${{ steps.signed_file_artifacts.outputs.signedFiles }}
            !*-release.apk

      - uses: jungwinter/split@v2
        if: startsWith(github.ref, 'refs/tags/v')
        id: signed_files
        with:
          msg: ${{ steps.sign_app.outputs.signedFiles }}
          separator: ":"

      - name: Build Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        id: changelog
        uses: ardalanamini/auto-changelog@v4
        with:
          preferred-api: Git
          mention-authors: false
          mention-new-contributors: false
          include-compare-link: false
          semver: false

      - name: Find and Replace
        if: startsWith(github.ref, 'refs/tags/v')
        uses: mad9000/actions-find-and-replace-string@5
        id: signed_file_path_0
        with:
          source: ${{ steps.signed_files.outputs._0 }}
          find: "/github/workspace/"
          replace: ""

      - name: Get Previous Tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: previous_tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: "${{ steps.signed_file_path_0.outputs.value }}"
          body: ${{ steps.changelog.outputs.changelog }}
          draft: true
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.previous_tag.outputs.previous_tag }}
          name: Release ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
